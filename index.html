<header class="mf-hero" id="mf-top"><div><div class="mf-eyebrow">MER · INDEPENDENT APP STUDIO</div><h1>일상의 작은 불편을<br>해결하는 앱들.</h1><p class="mf-lead">하루를 계획하고, 루틴을 이어가고, 둔 곳을 기억하는 일.<br>당신의 하루에 필요한 작은 앱을 만듭니다.</p><a class="mf-explore" href="#mf-apps">나에게 맞는 앱 찾기 <span aria-hidden="true">↓</span></a></div><div class="mf-family" data-family aria-label="Mer의 앱 5개"></div></header>

<script>
(()=>{
const root=document.getElementById('mer-final-home');
const media={
  "webmark": "/mer/assets/webmark.png",
  "stepcue": "/mer/assets/stepcue.webp",
  "boxday": "/mer/assets/boxday.webp",
  "mindtrade": "/mer/assets/mindtrade.webp",
  "putly": "/mer/assets/putly.webp",
  "lorumi": "/mer/assets/lorumi.webp",
  "stepcue-screen": "/stepcue/assets/en/timer.webp",
  "stepcue-store-0": "/stepcue/assets/en/timer.webp",
  "stepcue-store-1": "/stepcue/assets/en/editor.webp",
  "boxday-screen": "/boxday/assets/en/today.webp",
  "boxday-store-0": "/boxday/assets/en/today.webp",
  "boxday-store-1": "/boxday/assets/en/editor.webp",
  "mindtrade-screen": "/mindtrade/assets/en/quick-log.webp",
  "mindtrade-store-0": "/mindtrade/assets/en/quick-log.webp",
  "mindtrade-store-1": "/mindtrade/assets/en/insights.webp"
};
const apps=[
{key:'stepcue',name:'StepCue',category:'단계별 루틴 타이머',desc:'지금 할 일에만 집중하세요. 순서와 시간이 있는 루틴을 한 단계씩 이어갑니다.',id:'6805660905',tint:'#e5edef',detail:'각 단계에 이름과 시간을 정하면 타이머가 순서대로 이어집니다. 현재 단계와 남은 시간, 전체 완료 예정 시간을 확인할 수 있습니다.'},
{key:'putly',name:'Putly',category:'물건을 둔 곳 기록',desc:'“어디 뒀지?” 싶은 순간, 사진과 키워드로 물건을 둔 곳을 찾아보세요.',id:'6782760498',tint:'#e9e7df',detail:'충전기, 열쇠, 중요한 서류까지. 물건을 둔 곳을 사진과 키워드로 남겨두고 검색하세요. GPS 추적이 아닌, 기억을 돕는 기록에 집중합니다.'},
{key:'boxday',name:'Boxday',category:'간결한 하루 계획',desc:'한 줄로 적고 시간을 정하세요. 타임라인과 알림이 제때 시작하도록 돕습니다.',id:'6773940806',tint:'#eeeada',detail:'제목, 시작 시간, 진행 시간만으로 타임박스를 만드세요. 오늘의 타임라인에서 할 일을 확인하고 알림으로 다음 시작을 챙길 수 있습니다.'},
{key:'mindtrade',name:'MindTrade',category:'매매와 감정 일지',desc:'결과뿐 아니라 판단도 기록하세요. 감정과 매매를 함께 돌아보는 일지입니다.',id:'6767873530',tint:'#eae5ef',detail:'매수·매도·관망의 이유를 남기고, 감정 상태에 따른 결과를 비교하세요. 주식·코인 등 다양한 자산의 매매를 기록하고 자신의 투자 습관을 돌아보는 도구입니다.'},
{key:'lorumi',name:'Lorumi',category:'한국 귀화시험 학습',desc:'익숙한 언어의 도움으로, 한국 귀화시험과 면접을 차근차근 준비하세요.',id:'6798727080',tint:'#e5ebe3',detail:'한국어 문제와 답변 연습에 베트남어·중국어 간체·중국어 번체·크메르어·태국어 학습 도움을 제공합니다. 정부기관과 무관한 비공식 학습 앱입니다.'}
];
root.querySelector('[data-wordmark]').src=media.webmark;
root.querySelector('[data-family]').innerHTML=apps.map(a=>`<a href="#mf-${a.key}" aria-label="${a.name} 소개로 이동"><img src="${media[a.key]}" alt=""><span>${a.name}</span></a>`).join('');

const selector=root.querySelector('[data-language]');
const translate=(value,index)=>{const clean=value.trim();const row=phrases.find(p=>p[0]===clean);if(row)return value.replace(clean,row[index]);const app=apps.find(a=>clean.startsWith(a.name+' '));if(!app)return value;const suffix=phrases.find(p=>p[0]===clean.slice(app.name.length+1));return suffix?app.name+(index===2?'':' ')+suffix[index]:value;};
const walker=document.createTreeWalker(root,NodeFilter.SHOW_TEXT,{acceptNode:n=>n.parentElement.closest('style,script,select')?NodeFilter.FILTER_REJECT:NodeFilter.FILTER_ACCEPT});
const nodes=[];while(walker.nextNode())nodes.push([walker.currentNode,walker.currentNode.nodeValue]);
const labels=[root,...root.querySelectorAll('[aria-label],img[alt]')].flatMap(el=>['aria-label','alt'].filter(k=>el.hasAttribute(k)).map(k=>[el,k,el.getAttribute(k)]));
function language(code){const index={ko:0,en:1,ja:2}[code];root.lang=code;selector.setAttribute('aria-label',['언어','Language','言語'][index]);nodes.forEach(([node,original])=>node.nodeValue=translate(original,index));labels.forEach(([el,key,original])=>el.setAttribute(key,translate(original,index)));}
selector.addEventListener('change',()=>language(selector.value));language('en');


const catalog=root.querySelector('#mf-catalog');
const find=name=>catalog.querySelector('[data-'+name+']');
const query=find('query'), category=find('category');
const prev=find('prev'), next=find('next');
const groups=[
 ['루틴','Routines','習慣'],['생활','Everyday','暮らし'],['계획','Planning','計画'],['금융','Finance','金融'],['학습','Learning','学習']
];
const keywords=['타이머 timer タイマー','물건 photos 写真','시간 time 時間','매매 trading 取引','귀화 exam 試験'];
let page=0;
function renderCatalog(){
 const i={ko:0,en:1,ja:2}[root.lang];
 const t=(ko,en,ja)=>[ko,en,ja][i];
 find('cat-title').textContent=t('전체 앱','All apps','すべてのアプリ');
 query.placeholder=t('앱 이름이나 용도로 검색','Search by app name or purpose','名前や用途で検索');
 query.setAttribute('aria-label',query.placeholder);
 category.setAttribute('aria-label',t('카테고리','Category','カテゴリ'));
 const selected=category.value||'all';
 category.innerHTML='<option value="all">'+t('모든 카테고리','All categories','すべてのカテゴリ')+'</option>'+groups.map((g,n)=>'<option value="'+n+'">'+g[i]+'</option>').join('');
 category.value=selected;
 const entries=Array.from({length:apps.length},(_,n)=>{
   const group=n%apps.length, app=apps[group], demo=n>=apps.length;
   const name=demo?t('예시 앱 ','Sample app ','サンプルアプリ ')+(n+1):app.name;
   const description=demo?t('규모 테스트용 예시','Example for scale testing','規模確認用の例'):translate(app.desc,i);
   return {name,description,app,group,demo};
 });
 const term=query.value.trim().toLowerCase();
 const filtered=entries.filter(e=>(selected==='all'||String(e.group)===selected)&&[e.name,e.description,groups[e.group].join(' '),e.demo?'':keywords[e.group]].join(' ').toLowerCase().includes(term));
 const pages=Math.max(1,Math.ceil(filtered.length/12));
 page=Math.min(page,pages-1);
 find('count').textContent=t('검색 결과 ','Results: ','検索結果 ')+filtered.length+' / '+entries.length+(filtered.length?' · '+(page+1)+' / '+pages:'');
 find('results').innerHTML=filtered.slice(page*12,page*12+12).map(e=>{
  const icon=e.demo?'':'<img src="'+media[e.app.key]+'" alt="">';
  const link=e.demo?'':'<a href="#mf-'+e.app.key+'">'+t('앱 상세 보기','View app details','アプリの詳細')+'</a>';
  return '<article class="cat-item">'+icon+'<strong>'+e.name+'</strong><span>'+groups[e.group][i]+'</span><span>'+e.description+'</span>'+link+'</article>';
 }).join('')||'<p>'+t('일치하는 앱이 없습니다.','No matching apps.','一致するアプリがありません。')+'</p>';
 prev.textContent=t('이전','Previous','前へ');next.textContent=t('다음','Next','次へ');
 prev.disabled=page===0;next.disabled=page>=pages-1;
}
for(const control of [query,category])control.addEventListener(control===query?'input':'change',()=>{page=0;renderCatalog();});
prev.addEventListener('click',()=>{page--;renderCatalog();});
next.addEventListener('click',()=>{page++;renderCatalog();});
selector.addEventListener('change',renderCatalog);
renderCatalog();

})();
